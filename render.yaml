# Render Blueprint: New + > Blueprint, point it at your GitHub repo.
# Set the two secret values marked sync:false in the Render dashboard.
databases:
  - name: wardbook-db
    plan: free      # paid tier = daily backups; check Render's current free-tier limits before using it for real data
    databaseName: wardbook
    user: wardbook

services:
  - type: web
    name: wardbook
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --worker-class gthread --workers 1 --threads 40 --timeout 60
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: wardbook-db
          property: connectionString
      - key: SOCIETY_NAME
        value: Our Society          # shown in the header, change to your society's name
      - key: CLOUDINARY_URL
        sync: false                 # paste cloudinary://API_KEY:API_SECRET@CLOUD_NAME
      - key: VAPID_PUBLIC_KEY
        sync: false                 # Web Push public key
      - key: VAPID_PRIVATE_KEY
        sync: false                 # Web Push private key
      - key: VAPID_CLAIMS_EMAIL
        value: mailto:admin@example.com
